# PostgreSQL opsional untuk lingkungan yang menginginkan database server.
# Aplikasi juga dapat dijalankan tanpa ini memakai SQLite (lihat .env.example).
services:
  db:
    image: postgres:16-alpine
    container_name: hotelops-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotelops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotelops}
      POSTGRES_DB: ${POSTGRES_DB:-hotelops}
    ports:
      - "5432:5432"
    volumes:
      - hotelops_pgdata:/var/lib/postgresql/data
volumes:
  hotelops_pgdata:
